<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verteilungen erkunden</title><style>body{font:18px system-ui;background:#edf2f6;color:#173247;margin:0}main{max-width:1000px;margin:auto;padding:30px}section{background:white;padding:26px;border-radius:16px}button,select{font:inherit;padding:10px;border:1px solid #abc;border-radius:7px;background:white;cursor:pointer}nav{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.active{background:#175574;color:white}label{display:inline-block;margin:12px}canvas{width:100%;height:350px}p,details{line-height:1.6}.prompt{padding:14px;background:#fff3dc;border-left:4px solid #d98e21}#stats{padding:16px;background:#edf5fa;margin:18px 0}summary{cursor:pointer;font-weight:bold}small{color:#526778}#plots.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}h3{font-size:17px;margin:8px 0}@media(max-width:760px){#plots.compare{grid-template-columns:1fr}main,section{padding:16px}}#components{margin-top:12px}#plot-layout.with-legend{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:14px}#t-legend{font-size:14px;padding-top:20px}#t-legend span{display:flex;align-items:center;gap:7px;margin-bottom:8px;white-space:nowrap}#t-legend i{width:16px;height:3px}@media(max-width:560px){#plot-layout.with-legend{display:block}#t-legend:not([hidden]){display:flex;gap:12px;flex-wrap:wrap;padding-top:0}}nav{display:block}.nav-group{margin-bottom:14px}.nav-group h2{font-size:16px;margin:0 0 8px}.nav-buttons{display:flex;gap:8px;flex-wrap:wrap}</style><main><small>PLENUM</small><h1>Verteilungen erkunden</h1><nav id="nav"></nav><section><h2 id="title"></h2><p class="prompt" id="prompt"></p><div id="controls"></div><p id="legend"></p><div id="plot-layout"><div id="plots"><div><h3 id="simulation" hidden>Einzelne Poisson-Verteilungen</h3><canvas id="chart" role="img" aria-label="Diagramm zur Verteilung"></canvas></div><div id="comparison" hidden><h3>Verteilung der gepoolten Zählwerte</h3><canvas id="theory" role="img" aria-label="Poisson-Mischung und Referenz mit fester Rate"></canvas></div></div>
<aside id="t-legend" hidden aria-label="Legende">
  <span><i style="background:#2376a2"></i>Normalverteilung</span>
  <span><i style="background:#b15418"></i>t-Verteilung</span>
</aside></div><div id="components" hidden></div><div id="stats" aria-live="polite"></div></section></main><script>
const $=x=>document.getElementById(x);let mode=0,a=[],b=[];const names=['z-Werte','Überdispersion','Poisson → Normal','t und Normal im Vergleich','Binomial','Poisson','Negativ binomial','Normal','t-Verteilung','Binomial → Poisson'];
const avg=x=>x.reduce((s,v)=>s+v,0)/x.length;const variance=x=>{let m=avg(x);return x.reduce((s,v)=>s+(v-m)**2,0)/(x.length-1)};const f=(x,digits=4)=>x.toFixed(digits).replace('.',',');
function norm(){return Math.sqrt(-2*Math.log(1-Math.random()))*Math.cos(2*Math.PI*Math.random())}
function slider(id,text,min,max,v,step=1){return `<label>${text} <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${v}"><output id="${id}o">${v}</output></label>`}
function setup(i){mode=i;$('plot-layout').classList.toggle('with-legend',i===3);$('t-legend').hidden=i!==3;$('legend').hidden=i===3;$('comparison').hidden=i!==1;$('simulation').hidden=i!==1;$('components').hidden=i!==1;$('plots').classList.toggle('compare',i===1);$('nav').innerHTML = [
  ['1. Einzelne Verteilungen', [4,5,6,7,8]],
  ['2. Zusammenhänge', [0,9,2,3,1]]
].map(([heading, tabs]) => `<div class="nav-group"><h2>${heading}</h2><div class="nav-buttons">${tabs.map(j =>
  `<button class="${i===j?'active':''}" aria-pressed="${i===j}" onclick="setup(${j})">${names[j]}</button>`
).join('')}</div></div>`).join('');if(i>=4){setupSingle(i);return;}$('title').textContent=['Führt Standardisierung zur Normalverteilung?','Wie entsteht Überdispersion?','Wie genau ist die Normalapproximation?','Warum hat die t-Verteilung schwerere Randbereiche?'][i];$('prompt').textContent=['Was vermuten Sie? Ändert die z-Transformation die Schiefe, die Rangfolge oder die Anzahl der Gipfel?','Kann die Varianz größer als der Mittelwert sein, wenn Beobachtungen aus Poisson-Verteilungen mit verschiedenen Raten zusammengefasst werden?','Wie verändert sich die Ähnlichkeit der beiden Verteilungen, wenn λ wächst?','Was passiert mit t, wenn die geschätzte Standardabweichung ungewöhnlich klein ist?'][i];$('controls').innerHTML=[`<label>Form <select id="shape"><option value="Skewed">Schief</option><option value="Normal">Normalverteilt</option><option value="Bimodal">Zwei Gipfel</option></select></label><label><input type="checkbox" id="z"> z-Werte anzeigen</label>`,slider('groups','Anzahl der Gruppen',1,6,1)+slider('mu','Mittlere Rate',2,30,10)+slider('spread','Abstand zur mittleren Rate (Einheiten)',0,10,5)+`<label><input id="showNB" type="checkbox"> Negative Binomialverteilung einblenden</label>`,slider('lambda','λ',1,80,5),slider('n','Stichprobengröße',2,100,5)][i]+(i===0||i===3?'<button onclick="generate()">Neu simulieren</button>':'');$('controls').querySelectorAll('input,select').forEach(e=>e.oninput=()=>{if($(e.id+'o'))$(e.id+'o').value=e.value;if(e.id==='z')draw();else generate()});generate()}
function generate(){if(mode===0)a=Array.from({length:3000},()=> $('shape').value==='Skewed'?-10*Math.log(1-Math.random()):$('shape').value==='Normal'?50+10*norm():(Math.random()<.5?30:70)+7*norm());if(mode===3){let n=+$('n').value;a=[];b=[];for(let j=0;j<10000;j++){let x=Array.from({length:n},norm),m=avg(x);a.push(m/Math.sqrt(variance(x)/n));b.push(m*Math.sqrt(n))}}draw()}
function hist(x,lo,hi,n){let h=Array(n).fill(0),w=(hi-lo)/n;for(let v of x)if(v>=lo&&v<hi)h[Math.floor((v-lo)/w)]++;return h.map((v,i)=>[lo+(i+.5)*w,v/x.length/w])}
function plot(series,lo,hi,label,max,canvasId='chart'){let c=$(canvasId),w=c.clientWidth,h=350,d=devicePixelRatio;c.width=w*d;c.height=h*d;let g=c.getContext('2d');g.scale(d,d);let L=55,R=w-15,B=300,T=20;let X=x=>L+(x-lo)/(hi-lo)*(R-L),Y=y=>B-y/max*(B-T);g.font='12px system-ui';for(let j=0;j<=5;j++){let y=max*j/5,x=lo+(hi-lo)*j/5;g.strokeStyle='#dfe8ee';g.beginPath();g.moveTo(L,Y(y));g.lineTo(R,Y(y));g.stroke();g.fillStyle='#526778';g.fillText(f(y,2),2,Y(y)+4);g.fillText(f(x,1),X(x)-10,B+20)}g.save();g.beginPath();g.rect(L,T,R-L,B-T);g.clip();for(let s of series){g.strokeStyle=g.fillStyle=s.color;g.lineWidth=2.5;g.setLineDash(s.dash||[]);if(s.bar){let bw=(R-L)/s.p.length*.85;for(let [x,y]of s.p)g.fillRect(X(x)-bw/2,Y(y),bw,B-Y(y))}else{g.beginPath();s.p.forEach(([x,y],i)=>i?g.lineTo(X(x),Y(y)):g.moveTo(X(x),Y(y)));g.stroke()}}g.restore();g.fillStyle='#173247';g.fillText(label,L,343)}
function normalCDF(z) {
  const t = 1 / (1 + .2316419 * Math.abs(z));
  const polynomial = t * (.319381530 + t * (-.356563782 + t *
    (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
  const tail = Math.exp(-z * z / 2) / Math.sqrt(2 * Math.PI) * polynomial;
  return z < 0 ? tail : 1 - tail;
}

function maximumCumulativeDifference(lambda) {
  const sd = Math.sqrt(lambda);
  const maxCount = Math.ceil(lambda + 12 * sd + 20);
  // For negative integer thresholds, the largest normal tail is at k = -1.
  let largest = normalCDF((-.5 - lambda) / sd);
  let cumulative = 0;
  for (const [count, mass] of poissonMasses(lambda, maxCount)) {
    cumulative += mass;
    const normal = normalCDF((count + .5 - lambda) / sd);
    largest = Math.max(largest, Math.abs(cumulative - normal));
  }
  return largest;
}

function poissonMasses(rate, maxCount) {
  let mass = Math.exp(-rate);
  return Array.from({length: maxCount + 1}, (_, count) => {
    if (count > 0) mass *= rate / count;
    return [count, mass];
  });
}

function drawPoissonMixture() {
  const groups = Number($('groups').value);
  const mean = Number($('mu').value);
  const spreadControl = $('spread');
  spreadControl.max = mean;
  const spread = Math.min(mean, Number(spreadControl.value));
  spreadControl.value = spread;
  $('spreado').value = spread;
  const maxCount = 80;
  const colors = ['#2376a2', '#9c461c', '#7352a3', '#1b7956', '#a43665', '#605513'];
  const rates = Array.from({length: groups}, (_, i) =>
    groups === 1 ? mean : mean + spread * (2 * i / (groups - 1) - 1));
  const components = rates.map(rate => poissonMasses(rate, maxCount));
  const pooled = components[0].map(([count]) => [
    count, components.reduce((sum, component) => sum + component[count][1], 0) / groups
  ]);
  const rateVariance = rates.reduce((sum, rate) => sum + (rate - mean) ** 2, 0) / groups;
  const pooledVariance = mean + rateVariance;

  const series = [
    {p: pooled, color: '#176e59', bar: true},
    {p: poissonMasses(mean, maxCount), color: '#b15418', dash: [6, 4]}
  ];
  const showNB = $('showNB').checked;
  if (showNB) {
    const size = rateVariance > 0 ? mean ** 2 / rateVariance : Infinity;
    const prob = mean / pooledVariance;
    let mass = prob ** size;
    const fitted = rateVariance === 0 ? poissonMasses(mean, maxCount) : pooled.map(([count]) => {
      if (count > 0) mass *= (count - 1 + size) * (1 - prob) / count;
      return [count, mass];
    });
    series.push({p: fitted, color: '#73369a'});
  }
  const componentSeries = components.map((p, i) => ({p, color: colors[i]}));
  const peak = Math.max(...[...componentSeries, ...series].flatMap(({p}) => p.map(([, mass]) => mass)));
  const yMax = Math.min(1, Math.ceil(peak * 1.05 * 10) / 10);
  plot(componentSeries, -.5, maxCount + .5, 'Anzahl', yMax);
  plot(series, -.5, maxCount + .5, 'Anzahl', yMax, 'theory');

  $('legend').innerHTML = 'Wählen Sie zuerst eine Gruppe zufällig aus und ziehen Sie dann einen Poisson-Zählwert mit ihrer Rate. Alle Gruppen sind gleich wahrscheinlich. Rechts zeigen <strong style="color:#176e59">grüne Balken</strong> die gepoolte Verteilung und die <strong style="color:#b15418">orange gestrichelte Linie</strong> eine einzelne Poisson-Verteilung mit derselben mittleren Rate. Die y-Achse zeigt P(X = k).'
    + (showNB ? ' <strong style="color:#73369a">Violett:</strong> Negative Binomialverteilung mit demselben Mittelwert und derselben Varianz. Bei gleicher Rate in allen Gruppen wird ihr Poisson-Grenzfall gezeigt.' : '');
  $('components').innerHTML = 'Raten der Gruppen: ' + rates.map((rate, i) =>
    `<strong style="color:${colors[i]}">λ${i + 1} = ${f(rate,2)}</strong>`
  ).join(' · ');
  $('stats').textContent = `Mittelwert: ${f(mean,2)} · Varianz: ${f(pooledVariance,2)} · Varianz / Mittelwert: ${f(pooledVariance / mean,2)}`;
}

function setupSingle(i) {
  const configurations = [
    ['Binomialverteilung', 'Wie verändern Versuchszahl und Erfolgswahrscheinlichkeit die Anzahl der Erfolge?',
      slider('trials', 'Anzahl der Versuche n', 1, 50, 20) + slider('prob', 'Erfolgswahrscheinlichkeit p', .05, .95, .5, .05)],
    ['Poisson-Verteilung', 'Was passiert mit der Lage und Streuung, wenn die Rate steigt?',
      slider('lambda', 'Rate λ', 1, 40, 5)],
    ['Negative Binomialverteilung', 'Wie verändert sich die Zahl der Misserfolge bis zum letzten benötigten Erfolg?',
      slider('target', 'Zielzahl der Erfolge k', 1, 10, 3) + slider('prob', 'Erfolgswahrscheinlichkeit p', .2, .9, .5, .05)],
    ['Normalverteilung', 'Welcher Parameter verschiebt die Kurve? Welcher verändert ihre Breite?',
      slider('mean', 'Mittelwert μ', -6, 6, 0, .5) + slider('sd', 'Standardabweichung σ', .5, 4, 1, .1)
        + '<button type="button" onclick="setup(7)">Standardnormalverteilung</button>'],
    ['t-Verteilung', 'Wie verändert sich die Dichte mit der Zahl der Freiheitsgrade?',
      slider('df', 'Freiheitsgrade ν', 1, 60, 4)],
    ['Binomial → Poisson', 'Was passiert, wenn n wächst und p = 3/n kleiner wird?',
      slider('trials', 'Anzahl der Versuche n', 3, 150, 5)]
  ];
  const [title, prompt, controls] = configurations[i - 4];
  $('title').textContent = title;
  $('prompt').textContent = prompt;
  $('controls').innerHTML = controls;
  $('controls').querySelectorAll('input').forEach(input => {
    input.oninput = () => {
      $(input.id + 'o').value = f(Number(input.value), Number(input.step) < 1 ? 2 : 0);
      drawSingle();
    };
  });
  drawSingle();
}

function binomialMasses(n, p, maxCount = 50) {
  let mass = (1 - p) ** n;
  return Array.from({length: maxCount + 1}, (_, count) => {
    if (p === 1) return [count, Number(count === n)];
    if (count > n) return [count, 0];
    if (count > 0) mass *= (n - count + 1) * p / (count * (1 - p));
    return [count, mass];
  });
}

function negativeBinomialMasses(target, p) {
  let mass = p ** target;
  return Array.from({length: 91}, (_, count) => {
    if (count > 0) mass *= (count - 1 + target) * (1 - p) / count;
    return [count, mass];
  });
}

function tDensityScale(df) {
  let scale = df % 2 ? 1 / Math.PI : 1 / (2 * Math.sqrt(2));
  for (let v = df % 2 ? 3 : 4; v <= df; v += 2) {
    scale *= (v - 1) / Math.sqrt(v * (v - 2));
  }
  return scale;
}

function drawBinomialComparison() {
  const n = Number($('trials').value);
  const lambda = 3;
  const p = lambda / n;
  const maxCount = 18;
  plot([
    {p: binomialMasses(n, p, maxCount), color: '#2376a2', bar: true},
    {p: poissonMasses(lambda, maxCount), color: '#b15418'}
  ], -.5, maxCount + .5, 'Anzahl der Erfolge', 1);
  $('legend').textContent = 'Blau: Binomialverteilung. Orange: Poisson-Verteilung mit λ = 3. Die vertikale Achse zeigt P(X = k).';
  $('stats').textContent = `p = 3/n = ${f(p,3)} · Erwartungswert: n · p = λ = 3 · Binomialvarianz: n · p · (1 − p) = 3 · (1 − p) = ${f(lambda * (1 - p),2)} · Poissonvarianz: λ = 3`;
}

function drawSingle() {
  if (mode === 9) {
    drawBinomialComparison();
    return;
  }
  const number = id => Number($(id).value);
  let points, mean, varianceValue, label, legend, lo, hi, yMax;
  const discrete = mode <= 6;
  if (mode === 4) {
    const n = number('trials'), p = number('prob');
    points = binomialMasses(n, p);
    mean = n * p;
    varianceValue = n * p * (1 - p);
    label = 'Anzahl der Erfolge';
    [lo, hi, yMax] = [-.5, 50.5, 1];
  } else if (mode === 5) {
    mean = varianceValue = number('lambda');
    points = poissonMasses(mean, 70);
    label = 'Anzahl der Ereignisse';
    [lo, hi, yMax] = [-.5, 70.5, .4];
  } else if (mode === 6) {
    const target = number('target'), p = number('prob');
    points = negativeBinomialMasses(target, p);
    mean = target * (1 - p) / p;
    varianceValue = mean / p;
    label = 'Misserfolge bis zum k-ten Erfolg';
    [lo, hi, yMax] = [-.5, 90.5, .6];
  } else if (mode === 7) {
    mean = number('mean');
    const sd = number('sd');
    varianceValue = sd ** 2;
    [lo, hi, yMax] = [-12, 12, .85];
    points = Array.from({length: 481}, (_, index) => {
      const x = lo + index / 20;
      const z = (x - mean) / sd;
      return [x, Math.exp(-z * z / 2) / (sd * Math.sqrt(2 * Math.PI))];
    });
    label = 'Wert';
  } else {
    const df = number('df'), scale = tDensityScale(df);
    mean = df > 1 ? 0 : null;
    varianceValue = df > 2 ? df / (df - 2) : null;
    [lo, hi, yMax] = [-6, 6, .45];
    points = Array.from({length: 241}, (_, index) => {
      const x = lo + index / 20;
      return [x, scale * (1 + x * x / df) ** (-(df + 1) / 2)];
    });
    label = 'Wert';
  }
  legend = discrete ? 'Vertikale Achse: Wahrscheinlichkeit P(X = x).' : 'Vertikale Achse: Wahrscheinlichkeitsdichte.';
  plot([{p: points, color: '#2376a2', bar: discrete}], lo, hi, label, yMax);
  $('legend').textContent = legend;
  const formulas = {
    4: ['n · p', 'n · p · (1 − p)'],
    5: ['λ', 'λ'],
    6: ['k · (1 − p) / p', 'k · (1 − p) / p²'],
    7: ['μ', 'σ²'],
    8: ['0 für ν > 1', 'ν / (ν − 2) für ν > 2']
  };
  const [meanFormula, varianceFormula] = formulas[mode];
  $('stats').textContent = `Erwartungswert: ${meanFormula} → ${mean === null ? 'nicht definiert' : f(mean,2)} · Varianz: ${varianceFormula} → ${varianceValue === null ? 'keine endliche Varianz' : f(varianceValue,2)}`;
}

function draw() {
  if (mode >= 4) {
    drawSingle();
    return;
  }
  const blue = '#2376a2';
  const orange = '#b15418';
  if (mode === 0) {
    const mean = avg(a), sd = Math.sqrt(variance(a)), standardized = $('z').checked;
    const values = standardized ? a.map(x => (x - mean) / sd) : a;
    const lo = standardized ? -4 : 0, hi = standardized ? 6 : 110;
    plot([{p: hist(values, lo, hi, 45), color: blue, bar: true}], lo, hi,
      standardized ? 'Standardabweichungen vom Mittelwert' : 'Ursprüngliche Einheiten', standardized ? .8 : .13);
    $('legend').textContent = 'Blau: dieselbe Stichprobe auf der gewählten Skala. Vertikale Achse: Dichte.';
    $('stats').textContent = `Mittelwert ${f(avg(values))} · Stichprobenstandardabweichung ${f(Math.sqrt(variance(values)))} · n = 3.000`;
  }

  if (mode === 1) {
    drawPoissonMixture();
  }

  if (mode === 2) {
    const lambda = Number($('lambda').value);
    const hi = 110, mass = [], curve = [];
    mass.push(...poissonMasses(lambda, hi));
    for (let x = -.5; x <= hi; x += .1) {
      curve.push([x, Math.exp(-((x - lambda) ** 2) / (2 * lambda)) / Math.sqrt(2 * Math.PI * lambda)]);
    }
    plot([{p: mass, color: blue, bar: true}, {p: curve, color: orange}], -.5, hi + .5, 'Anzahl / Wert der Normalverteilung', .45);
    $('legend').textContent = 'Blau: Poisson-Wahrscheinlichkeitsmasse. Orange: Normaldichte.';
    $('stats').textContent = `Größte Abweichung der kumulierten Wahrscheinlichkeiten: ${f(100 * maximumCumulativeDifference(lambda), 2)} Prozentpunkte`;
  }

  if (mode === 3) {
    const n = Number($('n').value);
    plot([{p: hist(a,-6,6,90), color: orange}, {p: hist(b,-6,6,90), color: blue}], -6, 6, 'Wert der Statistik', .5);
    const tTail = a.filter(value => value > 2).length / a.length;
    const zTail = b.filter(value => value > 2).length / b.length;
    $('stats').textContent = `Freiheitsgrade: ${n - 1} · Simuliertes P(t > 2): ${f(100 * tTail, 2)} % · P(z > 2): ${f(100 * zTail, 2)} % · Differenz (t − z): ${f(100 * (tTail - zTail), 2)} Prozentpunkte`;
  }
}
window.addEventListener('resize',draw);setup(4);
</script></html>
