project:
  type: website
  output-dir: docs
  resources:
    - "materials/**"
    - "content/**"
    - ".nojekyll"
  render:
    - "*.qmd"
    - "!test_qmds/"
    - "!**/*.md"

website:
  title: "Methods in Data Analysis"
  site-url: "https://bioinfo-mobi.github.io/data-analysis/"
  sidebar:
    logo: figures/logo-white.png
    style: "floating"
    footer: |
      <div class="sidebar-credits">
      <span>Website</span> Lisa Duttenhöfer<br>
      <span>Course</span> Prof. Dr. Carl Herrmann
      </div>
    contents:
      - text: "WELCOME"
        href: index.qmd
      - text: "Getting started"
        href: 0_markdown.qmd
      - text: "Basics in Coding"
        href: coding_basics.qmd
      - text: "Chapter 1: Datatypes"
        href: 1_datentypen.qmd
      - text: "Chapter 2: Data Cleanup"
        href: 2_data_cleanup.qmd
      - text: "Chapter 3: Correlation & Clustering"
        href: 3_correlation_clustering.qmd
      - text: "Chapter 4: Hierarchical Clustering & PCA"
        href: 4_unsupervised_learning.qmd
      - text: "Chapter 5: Probability Distributions"
        href: 5_probability_distributions.qmd
      - text: "Chapter 6: CLT & Confidence Intervals"
        href: 6_clt_confidence_intervals.qmd
      - text: "Chapter 7: Hypothesis Testing & t-Tests"
        href: 7_hypothesis_testing.qmd
      - text: "Chapter 8: Non-Parametric & Proportion Tests"
        href: 8_nonparametric_proportion_tests.qmd
      - text: "Chapter 9: Regression Analysis"
        href: 9_regression_analysis.qmd

  navbar:
    background: "#ffffff"
    right:
      - text: "PYTHON"
        href: "#"
      - text: "R"
        href: "#"

format:
  html:
    theme:
      - cosmo
      - engine/custom.scss
    embed-resources: false
    include-in-header:
      - engine/language-switch.html
    cache-bust: true

execute:
  enabled: true
  freeze: false
  cache: false
